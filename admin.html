<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel | Gringas Troca</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1111">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/admin.css?v=60">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Menu do painel">
    <div class="brand"><img class="brand-logo" src="assets/logo-gringas-white.png" alt="Gringas Imports" width="340" height="160"><span class="brand-sub">TROCA • PAINEL</span></div>
    <nav>
      <button class="nav active" data-view="overview"><span class="nav-ico" aria-hidden="true">⌂</span><span class="nav-label">Visão geral</span></button>
      <button class="nav" data-view="evaluations"><span class="nav-ico" aria-hidden="true">▤</span><span class="nav-label">Avaliações</span></button>
      <button class="nav" data-view="clients"><span class="nav-ico" aria-hidden="true">◉</span><span class="nav-label">Clientes</span></button>
      <button class="nav" data-view="prices"><span class="nav-ico" aria-hidden="true">R$</span><span class="nav-label">Aparelhos e preços</span></button>
      <button class="nav" data-view="rules"><span class="nav-ico" aria-hidden="true">⚙</span><span class="nav-label">Regras de avaliação</span></button>
      <button class="nav" data-view="upgrade"><span class="nav-ico" aria-hidden="true">↗</span><span class="nav-label">Produtos para upgrade</span></button>
    </nav>
    <div class="side-foot">
      <a href="avaliar.html" target="_blank" rel="noopener"><span class="nav-ico" aria-hidden="true">↗</span><span class="nav-label">Abrir avaliação</span></a>
      <button type="button" class="side-logout" data-logout hidden><span class="nav-ico" aria-hidden="true">⎋</span><span class="nav-label">Sair</span></button>
    </div>
  </aside>
  <div class="backdrop" id="backdrop" hidden></div>

  <main>
    <header class="page-head">
      <button id="menuBtn" class="menu" type="button" aria-label="Abrir menu" aria-controls="sidebar" aria-expanded="false">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="titles"><h1 id="pageTitle">Visão geral</h1><p id="pageSub"></p></div>
      <div class="head-actions" id="headActions">
        <button type="button" class="logout-btn" data-logout hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          <span>Sair</span>
        </button>
      </div>
    </header>
    <section id="content"></section>
  </main>
</div>

<div class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-card" role="dialog" aria-modal="true" aria-label="Detalhes da avaliação">
    <button class="drawer-close" id="drawerClose" type="button" aria-label="Fechar">×</button>
    <div id="drawerContent"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
<script type="module" src="js/admin/app.js"></script>
</body>
</html>
