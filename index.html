<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gringas Troca — Passo 5.6 FINAL</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="icon-btn hidden" id="backBtn" aria-label="Voltar">←</button>
    <div class="brand"><span class="crown">♛</span><b>GRINGAS</b><small>TROCA</small></div>
    <button class="text-btn" id="restartBtn">Reiniciar</button>
  </header>

  <main id="screen"></main>
</div>

<template id="welcome">
<section class="screen welcome">

  <div class="hero-copy">
    <span class="pill">TROCA NA GRINGAS</span>

    <h1>Troque seu iPhone<br>por um novo.</h1>

    <p>
      Avalie seu aparelho em poucos minutos e descubra
      quanto ele pode valer na troca.
    </p>
  </div>

  <div class="phone-stage premium-phones">
    <div class="real-phone phone-duo">
      <div class="real-phone-camera duo-camera"></div>
      <span>iPhone 18<br><b>DUO</b></span>
    </div>

    <div class="real-phone phone-pro">
      <div class="real-phone-camera pro-camera"></div>
      <span>iPhone 18<br><b>PRO</b></span>
    </div>

    <div class="real-phone phone-pro-max">
      <div class="real-phone-camera pro-max-camera"></div>
      <span>iPhone 18<br><b>PRO MAX</b></span>
    </div>

    <div class="phone-glow premium-glow"></div>
  </div>

  <button class="primary" data-next="AVALIAR MEU IPHONE">
    AVALIAR MEU IPHONE <span>→</span>
  </button>

  <div class="trust">
    <span>◷ Avaliação em poucos minutos</span>
    <span>✓ Sem compromisso</span>
    <span>↻ Use como entrada na Gringas</span>
  </div>

  <div class="home-models">
    <div class="home-models-label">MODELOS ACEITOS NA TROCA</div>
    <h2>Do iPhone 11 ao mais novo.</h2>
    <p>Seu iPhone ainda vale. Faça uma avaliação e descubra.</p>

    <div class="home-model-list">
      <span>iPhone 11</span>
      <span>iPhone 12</span>
      <span>iPhone 13</span>
      <span>iPhone 14</span>
      <span>iPhone 15</span>
      <span>iPhone 16</span>
      <span>iPhone 17</span>
      <span>iPhone 18</span>
    </div>
  </div>

  <div class="home-steps">
    <div><strong>1</strong><span>Informe os dados<br>do seu aparelho</span></div>
    <div><strong>2</strong><span>Envie fotos<br>do seu iPhone</span></div>
    <div><strong>3</strong><span>Receba sua<br>avaliação</span></div>
  </div>

  <p class="legal">
    Avaliação inicial. O valor final será confirmado após análise física do aparelho.
  </p>

</section>
</template>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=56.2"></script>
<script src="cloud.js?v=56.2"></script>
<script src="app.js?v=56.2"></script>
</body>
</html>
